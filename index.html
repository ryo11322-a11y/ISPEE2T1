<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>チャット管理アプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="フォルダ一覧">
        <div class="sidebar-top">
          <div class="brand-block" aria-label="チャットアプリタイトル">
            <button class="menu-button" type="button" aria-label="メニュー">⋯</button>
            <span class="brand-name">チャット</span>
          </div>
          <div class="top-tools">
            <button class="tool-button add-folder-btn" id="addFolderButton" type="button" aria-label="フォルダを追加">＋</button>
          </div>
        </div>

        <nav class="folder-nav" id="folderList" aria-label="フォルダ一覧のナビゲーション"></nav>

        <div class="sidebar-footer">
          <button class="settings-button" type="button" aria-label="設定">⚙</button>
          <span>設定</span>
        </div>
      </aside>

      <main class="content-pane" aria-live="polite">
        <div class="empty-state" aria-hidden="true">
          <div class="empty-bubble">
            <span class="bubble bubble-left"></span>
            <span class="bubble bubble-right"></span>
          </div>
          <p>左のファイルからチャットを選択してください</p>
        </div>
      </main>
    </div>

    <div class="modal" id="renameModal" aria-hidden="true">
      <div class="modal-panel">
        <h3>フォルダ名の変更</h3>
        <label class="sr-only" for="renameInput">新しいフォルダ名</label>
        <input id="renameInput" type="text" maxlength="30" placeholder="新しいフォルダ名" />
        <div class="modal-actions">
          <button type="button" id="cancelRename" class="secondary-button">キャンセル</button>
          <button type="button" id="saveRename" class="primary-button">保存</button>
        </div>
      </div>
    </div>

    <div class="modal" id="deleteModal" aria-hidden="true">
      <div class="modal-panel danger-panel">
        <h3>フォルダを削除</h3>
        <p>本当に <strong id="deleteFolderName">このフォルダ</strong> を削除しますか？</p>
        <div class="modal-actions">
          <button type="button" id="cancelDelete" class="secondary-button">キャンセル</button>
          <button type="button" id="confirmDelete" class="danger-button">削除</button>
        </div>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
